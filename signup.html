<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | KrishiNetra</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">
        🌱 <span>Krishi<span>Netra</span></span>
    </div>

    <div class="nav-actions">

        <select id="languageSelect"
                class="language-select"
                onchange="changeLanguage(this.value)">

            <option value="en">🌐 English</option>
            <option value="hi">🌐 हिंदी</option>
            <option value="mr">🌐 मराठी</option>
            <option value="gu">🌐 ગુજરાતી</option>
            <option value="pa">🌐 ਪੰਜਾਬੀ</option>
            <option value="bn">🌐 বাংলা</option>

        </select>

        <a href="{{ url_for('home') }}"
           class="btn btn-outline"
           data-i18n="home">
            Home
        </a>

        <a href="{{ url_for('login') }}"
           class="btn btn-primary"
           data-i18n="login">
            Login
        </a>

    </div>

</header>


<!-- ================= SIGNUP ================= -->

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🌾
        </div>

        <h1 data-i18n="signupTitle">
            Create Account
        </h1>

        <p class="auth-subtitle"
           data-i18n="signupDescription">
            Join KrishiNetra and start smarter onion assessment.
        </p>


        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}


        <!-- SIGNUP FORM -->

        <form method="POST"
              action="{{ url_for('signup') }}"
              class="auth-form">

            <div class="form-group">

                <label for="username"
                       data-i18n="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    data-i18n-placeholder="chooseUsername"
                    minlength="3"
                    required>

            </div>


            <div class="form-group">

                <label for="password"
                       data-i18n="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    data-i18n-placeholder="createPassword"
                    minlength="4"
                    required>

            </div>


            <button type="submit"
                    class="btn btn-primary auth-submit"
                    data-i18n="signup">
                Sign Up
            </button>

        </form>


        <p class="auth-link">

            <span data-i18n="alreadyAccount">
                Already have an account?
            </span>

            <a href="{{ url_for('login') }}"
               data-i18n="login">
                Login
            </a>

        </p>


        <a href="{{ url_for('home') }}"
           class="back-link"
           data-i18n="backHome">
            ← Back to Home
        </a>

    </div>

</main>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
